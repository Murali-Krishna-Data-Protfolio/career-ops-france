name: Job Radar — publish page

# Rebuilds the mobile Job Radar page after each daily scan (and on demand).
# Needs GitHub Pages set to "GitHub Actions" (Settings → Pages) and a public repo
# or a paid plan — otherwise the deploy step fails and nothing else is affected.
on:
  workflow_run:
    workflows: ['Daily job scan (France · English · data roles)']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Build _site
        run: node build-site.mjs
      - name: Email/WhatsApp me if the page build failed
        if: failure()
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_WHATSAPP_PHONE: ${{ secrets.ALERT_WHATSAPP_PHONE }}
          ALERT_CALLMEBOT_APIKEY: ${{ secrets.ALERT_CALLMEBOT_APIKEY }}
        run: node notify-failure.mjs "Job Radar page build" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
