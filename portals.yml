# -- Job boards ---------------------------------------------------------------
job_boards:
  # Welcome to the Jungle: main board for Paris tech/data jobs. Server-side
  # filter = France offices + full-time or freelance + ENGLISH-language postings
  # (language:en keeps ~1 in 5 France data postings; checked 2026-11-04).
  - name: Welcome to the Jungle — France data
    provider: wttj
    wttj:
      filters: 'offices.country_code:FR AND language:en AND (contract_type:full_time OR contract_type:freelance)'
      queries:
        - "analytics engineer"
        - "data engineer"
        - "data analyst"
        - "business intelligence"
        - "power bi"
        - "microsoft fabric"
        - "dbt"
        - "databricks"
      max_hits: 500
    enabled: true
