# career-ops portal config — FRANCE ONLY (Paris / Île-de-France first)
# Candidate: Analytics Engineer / Data Engineer / BI, 3 yrs, English-language roles.
# Validate after editing:  node validate-portals.mjs
# Check boards still live: node verify-portals.mjs
# Run the scan:            node scan.mjs        (preview: node scan.mjs --dry-run)

# Prefer the English version when an ATS publishes a posting in several languages.
preferred_languages: [en]

# STRICT English-only gate (lib/english-gate.mjs, called from scan.mjs).
# Reads each new posting's full JD and drops it when the JD is in French,
# when it requires French (fluent / native / professional / C1 / bilingual),
# or when its language cannot be verified. "French is a plus" is kept.
english_only:
  enabled: true
  unknown: drop          # drop | keep — postings whose JD could not be read
  max_french_share: 0.3  # share of French stopwords above which a JD counts as French

# Only postings from the last 30 days (providers without a date always pass).
max_posting_age_days: 30

# 3 years of experience: label (don't drop) postings asking for 5+ years.
experience_filter:
  enabled: true
  stretch_years: 1
  action: label

# -- Title filter ------------------------------------------------------------
# Case-insensitive, accent-insensitive substring match on the job title.
title_filter:
  positive:
    # Analytics engineering
    - "Analytics Engineer"
    - "Analytics Engineering"
    - "Analytics Developer"
    # Data engineering
    - "Data Engineer"
    - "Data Engineering"
    - "Data Platform"
    - "DataOps"
    - "ETL Developer"
    - "Data Warehouse"
    - "Data Modeler"
    - "Microsoft Fabric"
    - "Databricks"
    # BI
    - "Business Intelligence"
    - "Power BI"
    - "BI Engineer"
    - "BI Developer"
    - "BI Analyst"
    - "BI Consultant"
    - "Reporting Analyst"
    - "Reporting Engineer"
    # Data analysis
    - "Data Analyst"
    - "Data Analytics"
    - "Analytics Analyst"
    - "Business Analyst"
    - "Data Consultant"
    - "Analytics Consultant"
  negative:
    # Internships / apprenticeships
    - "Junior"
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Alternance"
    - "Alternant"
    - "Apprenti"
    - "Stagiaire"
    - "word:Stage"
    - "Graduate Program"
    # Too senior for 3 years
    - "Principal"
    - "word:Staff"
    - "Head of"
    - "Director"
    - "Directeur"
    - "word:VP"
    - "word:Lead"
    - "word:Manager"
    - "Expert"
    # French seniority / trainer wording
    - "Confirmé"
    - "Expérimenté"
    - "Formateur"
    - "Formatrice"
    - "H-F"
    # French-titled postings (usually French-speaking roles; English-only search)
    - "Ingénieur"
    - "Ingenieur"
    - "Analyste"
    - "Développeur"
    - "Chargé"
    - "Chargée"
    - "Chef de projet"
    - "Responsable"
    - "Consultant(e)"
    - "H/F"
    - "F/H"
    # Off-target stacks
    - "SAP "
    - "Mainframe"
    - "COBOL"

# -- Location filter: France only ---------------------------------------------
location_filter:
  always_allow:
    - "France"
  allow:
    - "France"
    - "Paris"
    - "Île-de-France"
    - "Ile-de-France"
    - "Saint-Germain-en-Laye"
    - "La Défense"
    - "Puteaux"
    - "Courbevoie"
    - "Nanterre"
    - "Boulogne-Billancourt"
    - "Issy-les-Moulineaux"
    - "Levallois-Perret"
    - "Neuilly-sur-Seine"
    - "Saint-Denis"
    - "Saint-Ouen"
    - "Montrouge"
    - "Rueil-Malmaison"
    - "Versailles"
    - "Massy"
    - "Saclay"
    - "Lyon"
    - "Lille"
    - "Toulouse"
    - "Nantes"
    - "Bordeaux"
    - "Marseille"
    - "Montpellier"
    - "Rennes"
    - "Grenoble"
    - "Strasbourg"
    - "Nice"
    - "Sophia Antipolis"

# -- Description filter (only providers that return JD text: Ashby, Lever) ---
# Drops postings that require fluent/native French or are written in French.
content_filter:
  negative:
    - "fluent in french"
    - "fluency in french"
    - "french fluency"
    - "fluent french"
    - "native french"
    - "french native"
    - "french is mandatory"
    - "french is required"
    - "french is a must"
    - "french (fluent"
    - "french (native"
    - "français courant"
    - "francais courant"
    - "maîtrise du français"
    - "maitrise du francais"
    - "français natif"
    - "nous recherchons"
    - "vos missions"
    - "votre profil"
    - "rejoignez"

# -- Web-search discovery (used by the /career-ops scan agent mode) ----------
search_queries:
  - name: WTTJ — Paris data roles (English)
    query: 'site:welcometothejungle.com/en "Paris" "Analytics Engineer" OR "Data Engineer" OR "BI Engineer" OR "Power BI"'
    enabled: true
  - name: Greenhouse/Lever/Ashby — Paris data roles
    query: 'site:job-boards.greenhouse.io OR site:jobs.lever.co OR site:jobs.ashbyhq.com Paris "Analytics Engineer" OR "Data Engineer" OR "BI Developer"'
    enabled: true
  - name: LinkedIn — Paris Analytics Engineer (English)
    query: 'site:linkedin.com/jobs/view Paris "Analytics Engineer" OR "Power BI" OR "Microsoft Fabric" English'
    enabled: true

