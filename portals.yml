  # match triggers an urgent alert (popup + Gmail + WhatsApp).
  - name: "Allianz France"
    careers_url: https://careers.allianz.com
    provider: phenom
    phenom:
      urlPrefix: global/en
      selectedFields: { country: ["France"] }
